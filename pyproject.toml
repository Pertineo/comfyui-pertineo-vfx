[project]
name = "comfyui-pertineo-vfx"
description = "Compositing-grade VFX tools for ComfyUI: full-resolution, seamlessly tiled ViTMatte matting, trimap builder, refiner for video-model alphas (e.g. LTX), 16-bit PNG and 32-bit EXR sequence I/O, audit metadata (model hashes, licenses, node versions, production context, indicative GenAI triage) saved next to every image as text, JSON or PDF."
version = "1.4.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["OpenEXR>=3.2"]

[project.urls]
Repository = "https://github.com/Pertineo/comfyui-pertineo-vfx"

[tool.comfy]
PublisherId = "pertineo"
DisplayName = "Pertineo VFX"
