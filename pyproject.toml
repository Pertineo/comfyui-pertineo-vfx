[project]
name = "comfyui-pertineo-vfx"
description = "Compositing-grade VFX tools for ComfyUI: full-resolution, seamlessly tiled ViTMatte matting, trimap builder, refiner for video-model alphas (e.g. LTX), fast 16-bit PNG / TIFF / EXR sequence and ProRes / H.265 video output with versions and date folders, seam repair for chained video generations (detect, stabilize, interpolate, regenerate, blend overlaps), audit metadata (model hashes, licenses, node versions, production context, indicative GenAI triage) saved next to every image as text, JSON or PDF, and an audit chain that connects all steps of a job."
version = "1.8.2"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["OpenEXR>=3.2"]

[project.urls]
Repository = "https://github.com/Pertineo/comfyui-pertineo-vfx"

[tool.comfy]
PublisherId = "pertineo"
DisplayName = "Pertineo VFX"
